       <div class="espaço-carrinho ">                
<header style="display: flex; justify-content: flex-end; padding: 20px; position: relative;">

      <div style="position: relative; display: inline-block;">
       
  
        <div class="logo-carrinho">
        <img src="imagens/cart-shopping-solid (1).svg" alt="" width="35">
        <span id="contador-carrinho">0</span>
       
      </div>
      </div>
</header>
</div> 

<input type="number" id="quantidade" value="1" min="1" max="99">
<button id="btn-adicionar"onclick="adicionarAoCarrinho()">Adicionar ao carrinho</button>
                    
                      </div>
                    </div>
                    
                <script>
  let totalCarrinho = 0;

  function adicionarAoCarrinho() {
    const quantidadeInput = document.getElementById('quantidade');
    const quantidade = parseInt(quantidadeInput.value);

    if (!isNaN(quantidade) && quantidade > 0) {
      totalCarrinho += quantidade;
      document.getElementById('contador-carrinho').innerText = totalCarrinho;
    }
  }

  function adicionarAoCarrinho() {
  const quantidadeInput = document.getElementById('quantidade');
  const quantidade = parseInt(quantidadeInput.value);
  const contador = document.getElementById('contador-carrinho');
  const botao = document.getElementById('btn-adicionar');

  if (!isNaN(quantidade) && quantidade > 0) {
    totalCarrinho += quantidade;
    contador.innerText = totalCarrinho;

    // muda a cor do botão ao clicar
    botao.classList.add('clicado');

    // opcional: volta à cor original depois de 1 segundo
    setTimeout(() => {
      botao.classList.remove('clicado');
    }, 1000);
  }
}

</script>
